id = "hi_events"
name_zh = "票务"
name_en = "Ticketing"
version = "0.1.0"
module_api = 1
integration_status = "source_integrated"
[verification]
source = "verified"
database = "verified"
runtime = "pending"
e2e = "pending"


[source]
repository = "https://github.com/tuyutata/Hi.Events"
commit = "048243e2a99a65c8e77fc6f3cb44de158169855e"
path = "upstream/hi_events"

[runtime]
family = "php-laravel"
build = "offline_php_node"
start = "tuyu_hi_events_postgresql"

[runtime.ports]
https = 58446
gateway = 58447
fastcgi = 58448
frontend = 58449

[localization]
default = "zh-CN"
supported = ["zh-CN", "en"]

[authentication]
administrator = "tuyu_sr25519_local_qr"
staff = "upstream_native"

[access]
employee_access = "lan_browser"
https_required = true
public_access = false
gateway_only = true

[database]
engine = "postgresql"
database = "tuyubooking"
schema = "module_hi_events"
role = "tuyu_hi_events_app"
isolated_database = false
additional_persistent_database = false

[orders]
owns_orders = true
event_contract = "tuyubooking.order.v1"
