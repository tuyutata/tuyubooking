name: tuyubooking
description: TuyuBooking unified desktop host and mobile application.
publish_to: "none"
# 主机与分机各平台的正式首版从 1.0.0 起步；后续分别按自身正式 Release 递增。
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  citizen_sdk:
    git:
      url: https://github.com/crcfrcn/citizensdk.git
      path: .
      ref: 3e53f18354e1b21c75d7e4543f2102ba8163c575
  crypto: 3.0.7
  ffi: 2.2.0
  flutter:
    sdk: flutter
  flutter_lite_camera: ^0.1.0
  flutter_localizations:
    sdk: flutter
  http: 1.6.0
  mobile_scanner: 7.4.2
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  zxing2: ^0.2.4

dev_dependencies:
  # 钱包入口组件测试通过平台接口隔离磁盘，不依赖传递依赖声明。
  path_provider_platform_interface: ^2.1.3
  yaml: ^3.1.3
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  # Apple platforms use the existing Podfiles and CitizenSdk CocoaPods bridge.
  config:
    enable-swift-package-manager: false
  assets:
    - tuyu_logo.png
  uses-material-design: true
  generate: true
