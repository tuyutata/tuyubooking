[package]
name = "tuyubooking-native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "tuyubooking_native"
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
async-trait = "=0.1.92"
base64 = "=0.22.1"
libc = "0.2"
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=1.1.4"
sha2 = "=0.10.9"
schnorrkel = { version = "=0.11.5", default-features = false, features = ["alloc", "getrandom", "preaudit_deprecated"] }
thiserror = "=2.0.20"
time = { version = "0.3", features = ["serde"] }
tokio = { version = "=1.53.1", features = ["process", "rt", "rt-multi-thread", "sync", "time"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-serde_json-1", "with-time-0_3"] }
tuyu-account = { git = "https://github.com/tuyutata/tuyuserve.git", rev = "435e585bd59aabe5bec3d4ca21074abbae864b43" }
uuid = { version = "1", features = ["serde", "v7"] }
zeroize = "=1.9.0"

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }
