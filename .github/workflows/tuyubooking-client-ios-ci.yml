# tuyubooking.client-ios.ci 的独立 GitHub 工作流。
name: tuyubooking.client-ios.ci
# 远端标题只展示产品、平台、流程；内部 pipeline 仍承担唯一机器身份。
run-name: "${{ inputs.run_title }}"
'on':
  workflow_dispatch:
    inputs:
      pipeline:
        required: true
        type: string
      run_title:
        required: true
        type: string
      source_sha:
        required: false
        type: string
      ci_run_id:
        required: false
        type: string
      version_tag:
        required: false
        type: string
      software_version:
        required: false
        type: string
      spec_version:
        required: false
        type: string
      chain_spec_version:
        required: false
        type: string
      genesis_hash:
        required: false
        type: string
      finalized_head:
        required: false
        type: string
concurrency:
  group: tuyubooking.client-ios.ci
  cancel-in-progress: false
jobs:
  flow:
    name: 途遇商家端 · CI · 分机 iOS
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read
    env:
      CI: true
      WRANGLER_SEND_METRICS: false
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
      CARGO_INCREMENTAL: '0'
      GH_TOKEN: "${{ github.token }}"
      TUYU_SOURCE_SHA: "${{ github.sha }}"
      SOURCE_SHA: "${{ github.sha }}"
    steps:
    - shell: bash
      env:
        PIPELINE: "${{ inputs.pipeline }}"
        RUN_TITLE: "${{ inputs.run_title }}"
        SOURCE_SHA: "${{ inputs.source_sha }}"
        CI_RUN_ID: "${{ inputs.ci_run_id }}"
        VERSION_TAG: "${{ inputs.version_tag }}"
        SOFTWARE_VERSION: "${{ inputs.software_version }}"
        SPEC_VERSION: "${{ inputs.spec_version }}"
        CHAIN_SPEC_VERSION: "${{ inputs.chain_spec_version }}"
        GENESIS_HASH: "${{ inputs.genesis_hash }}"
        FINALIZED_HEAD: "${{ inputs.finalized_head }}"
      run: |-
        node --input-type=module <<'NODE'
        const e=process.env,allowed=new Set(["tuyubooking.client-ios.ci"]);
        if(!allowed.has(e.PIPELINE||''))throw Error('产品流程身份无效');
        if(e.RUN_TITLE!=="途遇商家端 · 分机 iOS · CI")throw Error('产品平台流程展示标题无效');
        if([e.CI_RUN_ID,e.VERSION_TAG,e.SOFTWARE_VERSION,e.SPEC_VERSION,e.CHAIN_SPEC_VERSION,e.GENESIS_HASH,e.FINALIZED_HEAD].some(Boolean))throw Error('CI输入包含Release字段');
        NODE
    - name: 检出准确产品源码
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: "${{ github.sha }}"
        fetch-depth: 0
        persist-credentials: false
    - name: 装载准确Java
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
      with:
        distribution: temurin
        java-version: 25.0.1+8
    - name: 装载Android SDK
      uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
    - id: flutter_0
      shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/client/ci/ios/client-ios/execute.mjs" workflow-step 0
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        flutter-version: "${{ steps.flutter_0.outputs.version }}"
        cache: false
    - shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/client/ci/ios/client-ios/execute.mjs" workflow-step 1
    - id: tuyubooking_client__ci_cache
      env:
        GH_TOKEN: "${{ github.token }}"
        CI_CACHE_PRODUCT: tuyubooking-client
        CI_CACHE_PLATFORM: "${{ 'ios' || false && 'android' || false && 'macos' || 'windows' }}"
        CI_CACHE_ARCHITECTURE: "${{ false && 'x64' || 'arm64' }}"
        CI_CACHE_COMPONENT: ci_client_ios
        CI_CACHE_WORKFLOW: tuyubooking.client-ios.ci
        CI_CACHE_JOB: ci_client_ios
        CI_CACHE_TOOLCHAIN_FINGERPRINT: "${{ hashFiles('**/Cargo.lock', '**/pubspec.lock', '**/package-lock.json', '**/dependencies.lock.json', '**/runtime.lock.json') }}"
        CI_CACHE_PATHS: |
          dart-pub
          cocoapods
          gradle
          flutter-build
        CI_CACHE_LINKS: 'app/build=flutter-build

          '
        CI_CACHE_FINALS: |
          flutter-build/ios/iphoneos/Runner.app
          flutter-build/release-candidate
      shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/client/ci/ios/client-ios/execute.mjs" workflow-step 2
    - name: 恢复上一次成功的CI增量缓存
      continue-on-error: true
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
      with:
        path: "${{ steps.tuyubooking_client__ci_cache.outputs.success_paths }}"
        key: "${{ steps.tuyubooking_client__ci_cache.outputs.restore_key }}"
    - shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/client/ci/ios/client-ios/execute.mjs" workflow-step 3
    - shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/client/ci/ios/client-ios/execute.mjs" workflow-step 4
    - if: "${{ failure() && !cancelled() }}"
      env:
        CI_CACHE_TERMINAL_STATE: failure
      shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/client/ci/ios/client-ios/execute.mjs" workflow-step 5
    - if: "${{ failure() && !cancelled() }}"
      name: 保存本次失败的CI增量缓存
      id: tuyubooking_client__ci_cache_save_failure
      continue-on-error: true
      uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
      with:
        path: "${{ steps.tuyubooking_client__ci_cache.outputs.failure_paths }}"
        key: "${{ steps.tuyubooking_client__ci_cache.outputs.failure_key }}"
    - if: "${{ failure() && !cancelled() && steps.tuyubooking_client__ci_cache_save_failure.outcome == 'success' }}"
      continue-on-error: true
      env:
        GH_TOKEN: "${{ github.token }}"
        CI_CACHE_TERMINAL_STATE: failure
      shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/client/ci/ios/client-ios/execute.mjs" workflow-step 6
    - if: "${{ success() }}"
      env:
        CI_CACHE_TERMINAL_STATE: success
      shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/client/ci/ios/client-ios/execute.mjs" workflow-step 7
    - if: "${{ success() }}"
      name: 保存本次成功的CI增量缓存
      id: tuyubooking_client__ci_cache_save_success
      continue-on-error: true
      uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
      with:
        path: "${{ steps.tuyubooking_client__ci_cache.outputs.success_paths }}"
        key: "${{ steps.tuyubooking_client__ci_cache.outputs.success_key }}"
    - if: "${{ success() && steps.tuyubooking_client__ci_cache_save_success.outcome == 'success' }}"
      continue-on-error: true
      env:
        GH_TOKEN: "${{ github.token }}"
        CI_CACHE_TERMINAL_STATE: success
      shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/client/ci/ios/client-ios/execute.mjs" workflow-step 8
